name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Rebuild historical model deterministically
        run: python scripts/build_historical_model.py --output /tmp/historical-model.json
      - name: Verify committed model matches production input
        run: cmp data/historical-model.json /tmp/historical-model.json
      - name: Validate production historical files
        run: python scripts/validate_historical_dataset.py --model data/historical-model.json --output /tmp/historical-validation.json
      - run: python -m pytest
      - run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R assets data _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
