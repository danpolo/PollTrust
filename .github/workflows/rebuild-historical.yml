name: Rebuild historical model
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build_historical_model.py
      - run: python -m pytest
      - uses: actions/upload-artifact@v4
        with:
          name: historical-model
          path: data/historical-model.json
