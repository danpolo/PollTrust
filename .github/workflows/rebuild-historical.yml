name: Rebuild historical calibration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Recollect pinned historical sources
        run: python scripts/build_historical_dataset.py --refresh
      - name: Rebuild production model
        run: python scripts/build_historical_model.py
      - name: Audit dataset and model
        run: python scripts/validate_historical_dataset.py --model data/historical-model.json
      - run: python -m pytest
      - uses: actions/upload-artifact@v4
        with:
          name: historical-calibration
          path: |
            data/historical-polls.json
            data/historical-model.json
            data/historical-validation.json
