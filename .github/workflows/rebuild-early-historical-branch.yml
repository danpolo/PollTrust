name: Rebuild early historical horizon branch
on:
  push:
    branches: [fix/early-historical-horizons]
    paths:
      - scripts/build_historical_dataset.py
      - polltrust/model.py
      - tests/**
      - .github/workflows/rebuild-early-historical-branch.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/early-historical-horizons
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Recollect pinned historical sources
        run: python scripts/build_historical_dataset.py --refresh
      - name: Rebuild production model
        run: python scripts/build_historical_model.py
      - name: Audit dataset and model
        run: python scripts/validate_historical_dataset.py --model data/historical-model.json
      - run: python -m pytest
      - name: Commit regenerated historical calibration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical-polls.json data/historical-model.json data/historical-validation.json
          if git diff --cached --quiet; then
            echo "No generated historical changes"
          else
            git commit -m "data: rebuild extended historical calibration"
            git push origin HEAD:fix/early-historical-horizons
          fi
