name: Debug current poll ingestion
on:
  push:
    branches: [feature/current-polls]
permissions:
  contents: write
jobs:
  live-ingestion:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch live current polls
        run: python scripts/update_current_polls.py
      - name: Validate current data
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests/test_current_poll_adapter.py tests/test_ingestion.py tests/test_data.py
      - name: Print imported poll summary
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          d=json.load(open('data/current-polls.json', encoding='utf-8'))
          print('last_successful_check', d.get('last_successful_check'))
          print('last_successful_update', d.get('last_successful_update'))
          print('polls', len(d.get('polls', [])))
          print('by pollster', Counter(p['pollster'] for p in d.get('polls', [])))
          for p in d.get('polls', []):
              print(p['date'], p['pollster'], p.get('outlet'), sum(p['parties'].values()), p['parties'])
          PY
      - name: Commit live current data
        run: |
          if git diff --quiet -- data/current-polls.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current-polls.json
          git commit -m "data: seed validated current polls"
          git push
