name: Update current polls
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/sources.json
      - polltrust/adapters/**
      - scripts/update_current_polls.py
permissions:
  contents: write
concurrency:
  group: update-current-polls
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and merge current polls
        run: python scripts/update_current_polls.py
      - name: Validate current data
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests/test_current_poll_adapter.py tests/test_ingestion.py tests/test_data.py
      - name: Commit valid changes
        run: |
          if git diff --quiet -- data/current-polls.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current-polls.json
          git commit -m "data: update current polls"
          git push
