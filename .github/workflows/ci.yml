name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Rebuild historical model deterministically
        run: python scripts/build_historical_model.py --output /tmp/historical-model.json
      - name: Verify committed model matches rebuild
        run: cmp data/historical-model.json /tmp/historical-model.json
      - name: Validate committed historical dataset and model
        run: python scripts/validate_historical_dataset.py --model data/historical-model.json --output /tmp/historical-validation.json
      - name: Validate frontend JavaScript syntax
        run: node --check assets/app.js
      - run: python -m pytest
