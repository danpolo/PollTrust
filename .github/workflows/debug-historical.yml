name: Validate historical sources
on:
  push:
    branches: [work/real-historical-data]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Build historical dataset from live sources
        run: python scripts/build_historical_dataset.py --refresh
      - name: Build production historical model
        run: python scripts/build_historical_model.py --input data/historical-polls.json --output data/historical-model.json
      - name: Audit dataset and model
        run: python scripts/validate_historical_dataset.py --model data/historical-model.json
      - name: Run complete tests
        run: python -m pytest
      - name: Commit validated historical calibration
        if: github.ref == 'refs/heads/work/real-historical-data'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical-polls.json data/historical-model.json data/historical-validation.json
          git diff --cached --quiet && exit 0
          git commit -m "Commit validated historical calibration data"
          git push
      - name: Print audit summary
        if: always()
        run: |
          if [ -f data/historical-validation.json ]; then
            python - <<'PY'
          import json
          d=json.load(open('data/historical-validation.json'))
          print(json.dumps({
              'valid': d.get('valid'),
              'poll_count': d.get('poll_count'),
              'by_election': d.get('poll_counts_by_election'),
              'by_pollster': d.get('poll_counts_by_pollster'),
              'lineage_coverage': d.get('lineage_coverage'),
              'same_day_competing': d.get('same_day_competing_projections'),
              'suspicious_values': d.get('suspicious_imported_values'),
              'unmatched_pollsters': d.get('parser_diagnostics',{}).get('unmatched_pollster_names'),
              'malformed_count': len(d.get('parser_diagnostics',{}).get('malformed_rows',[])),
              'skipped_count': len(d.get('parser_diagnostics',{}).get('skipped_rows',[])),
              'duplicates_removed': len(d.get('parser_diagnostics',{}).get('duplicates_removed',[])),
              'source_reparse': d.get('source_reparse_verification'),
              'errors': d.get('errors'),
              'model_errors': d.get('model_errors'),
          }, ensure_ascii=False, indent=2))
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-audit
          path: |
            data/historical-polls.json
            data/historical-model.json
            data/historical-validation.json
